name: Contribution graph

# The free hosted graph services (github-readme-activity-graph, github-readme-stats,
# profile-summary-cards) share one GitHub API quota across every user on the internet
# and are down more often than not. This renders the graph into this repo instead, so
# the README points at raw.githubusercontent.com and can never rate-limit.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-grid.svg?palette=github-dark&color_snake=#00D9FF&color_dots=#161B22,#0a4a5c,#0d7a99,#00b8d9,#00D9FF

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
